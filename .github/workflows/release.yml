name: Release

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - CMakeLists.txt
            - .github/workflows/release.yml

permissions:
    contents: read

jobs:
    core:
        outputs:
            tag: ${{ steps.version.outputs.tag }}
        runs-on: ubuntu-latest
        steps:
            -
                uses: actions/checkout@v4
            -
                name: Configure
                run: >
                    cmake -S . -B build
                    -DNTD_BUILD_NUKE_PLUGIN=OFF
                    -DNTD_WARNINGS_AS_ERRORS=ON
            -
                id: version
                name: Read project version
                shell: bash
                run: |
                    version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)"
                    if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                        echo "Invalid project version: ${version}"
                        exit 1
                    fi
                    echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
            -
                name: Build
                run: cmake --build build --parallel
            -
                name: Test
                run: ctest --test-dir build --output-on-failure

    release:
        needs: core
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            -
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0
            -
                name: Publish source release
                env:
                    GH_TOKEN: ${{ github.token }}
                    RELEASE_TAG: ${{ needs.core.outputs.tag }}
                shell: bash
                run: |
                    if ! git rev-parse --verify "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
                        git config user.name "github-actions[bot]"
                        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                        git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}" "${GITHUB_SHA}"
                        git push origin "${RELEASE_TAG}"
                    fi

                    if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
                        echo "${RELEASE_TAG} is already published."
                        exit 0
                    fi

                    gh release create "${RELEASE_TAG}" \
                        --generate-notes \
                        --title "${RELEASE_TAG}" \
                        --verify-tag
