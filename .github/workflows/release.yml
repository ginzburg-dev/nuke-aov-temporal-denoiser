name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: read

jobs:
    core:
        runs-on: ubuntu-latest
        steps:
            -
                uses: actions/checkout@v4
            -
                name: Configure
                run: >
                    cmake -S . -B build
                    -DNTD_BUILD_NUKE_PLUGIN=OFF
                    -DNTD_WARNINGS_AS_ERRORS=ON
            -
                name: Build
                run: cmake --build build --parallel
            -
                name: Test
                run: ctest --test-dir build --output-on-failure

    release:
        needs: core
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            -
                uses: actions/checkout@v4
            -
                name: Publish source release
                env:
                    GH_TOKEN: ${{ github.token }}
                shell: bash
                run: |
                    if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
                        exit 0
                    else
                        gh release create "${GITHUB_REF_NAME}" \
                            --generate-notes \
                            --title "Ginzburg Temporal Denoiser ${GITHUB_REF_NAME}" \
                            --verify-tag
                    fi
